[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sarkit-processing"
dynamic = ["version"]
description = "Interacting with SAR data in proven, but nonstandard ways in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Valkyrie Systems Corporation", email = "info@govsco.com"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.0.2",
    "networkx>=3",
    "numba>=0.63.1",
    "numpy>=2.0.0",
    "sarkit>=1.10.0",
    "scipy>=1.15.0",
    "shapely>=2.1.0",
]

[project.scripts]
sarkit-processing = "sarkit_processing.__main__:main"
skp = "sarkit_processing.__main__:main"

[tool.setuptools_scm]
version_file = "src/sarkit_processing/_version.py"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
test = [
    "aiohttp>=3.11",
    "pytest>=7.4.4",
    "smart_open[http]>=7.1.0",
]

[tool.ruff.lint]
select = [
    "B015",  # useless-comparison
    "B018",  # useless-expression
    "E4",  # pycodestyle Import
    "E7",  # pycodestyle Statement
    "E9",  # pycodestyle Runtime
    "F",   # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "NPY",  # NumPy-specific
    "ISC", # flake8-implicit-str-concat
    "RUF022", # unsorted-dunder-all
]
preview = true

[[tool.mypy.overrides]]
module = [
    "lxml.*",
    "networkx.*",
    "numba.*",
    "scipy.*",
    "shapely.*",
    "smart_open.*",
]
ignore_missing_imports = true

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
reinstall-package = ["sarkit-processing"]  # force reinstall to generate _version.py
